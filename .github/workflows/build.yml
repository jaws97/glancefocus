name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      # /bin/bash is the bash 3.2 that ships with macOS, which is what most people run build.sh with.
      - name: Build GlanceFocus.app
        run: /bin/bash build.sh

      # Again under a pseudo-terminal, so the animated progress display is exercised too.
      - name: Installer animation smoke test
        run: |
          script -q /dev/null /bin/bash build.sh
          test -x build/GlanceFocus.app/Contents/MacOS/GlanceFocus

      - name: Check signature, architecture and size
        run: |
          codesign --verify --verbose build/GlanceFocus.app
          lipo -archs build/GlanceFocus.app/Contents/MacOS/GlanceFocus
          du -sh build/GlanceFocus.app
          ls -lh build/GlanceFocus.app/Contents/MacOS/GlanceFocus

      # build.sh calls swiftc directly; keep Package.swift building too, for opening in Xcode.
      - name: Swift Package Manager build
        run: swift build -c release

      # ditto keeps the executable bit, which a plain artifact upload would drop.
      - name: Zip app
        run: ditto -c -k --keepParent build/GlanceFocus.app build/GlanceFocus.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GlanceFocus
          path: build/GlanceFocus.zip
